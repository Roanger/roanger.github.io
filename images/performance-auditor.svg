<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#131b2e"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b4a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff6b4a" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Top Header Bar -->
  <rect x="28" y="22" width="744" height="52" rx="10" fill="#161f30" stroke="rgba(0,212,255,0.25)" stroke-width="1"/>
  <circle cx="52" cy="48" r="6" fill="#00e676"/>
  <text x="68" y="53" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">PERFORMANCE AUDITOR</text>
  <rect x="285" y="36" width="160" height="24" rx="12" fill="rgba(0,212,255,0.12)" stroke="rgba(0,212,255,0.4)" stroke-width="1"/>
  <text x="365" y="52" fill="#00d4ff" font-family="monospace" font-size="11" text-anchor="middle">VK_LAYER_ROANGER</text>
  <text x="748" y="52" fill="#8b9bb4" font-family="monospace" font-size="12" text-anchor="end">gRPC LIVE • 60.0 FPS</text>

  <!-- Metric Cards Row -->
  <!-- Card 1: Frame Time -->
  <rect x="28" y="90" width="174" height="78" rx="8" fill="#151d2c" stroke="rgba(255,255,255,0.08)"/>
  <text x="44" y="114" fill="#8b9bb4" font-family="sans-serif" font-size="11" font-weight="600">GPU FRAME TIME</text>
  <text x="44" y="148" fill="#00d4ff" font-family="monospace" font-size="24" font-weight="700">4.82 ms</text>
  <text x="148" y="148" fill="#00e676" font-family="monospace" font-size="11">-3.1%</text>

  <!-- Card 2: Draw Calls -->
  <rect x="218" y="90" width="174" height="78" rx="8" fill="#151d2c" stroke="rgba(255,255,255,0.08)"/>
  <text x="234" y="114" fill="#8b9bb4" font-family="sans-serif" font-size="11" font-weight="600">DRAW CALLS / FRAME</text>
  <text x="234" y="148" fill="#ffffff" font-family="monospace" font-size="24" font-weight="700">1,842</text>
  <text x="328" y="148" fill="#8b9bb4" font-family="monospace" font-size="11">DIRECT</text>

  <!-- Card 3: VRAM Usage -->
  <rect x="408" y="90" width="174" height="78" rx="8" fill="#151d2c" stroke="rgba(255,255,255,0.08)"/>
  <text x="424" y="114" fill="#8b9bb4" font-family="sans-serif" font-size="11" font-weight="600">VRAM ALLOCATED</text>
  <text x="424" y="148" fill="#ffab40" font-family="monospace" font-size="24" font-weight="700">2.41 GB</text>
  <text x="530" y="148" fill="#00e676" font-family="monospace" font-size="11">0 LEAKS</text>

  <!-- Card 4: CI Status -->
  <rect x="598" y="90" width="174" height="78" rx="8" fill="#151d2c" stroke="rgba(0,230,118,0.25)"/>
  <text x="614" y="114" fill="#8b9bb4" font-family="sans-serif" font-size="11" font-weight="600">CI REGRESSION CHECK</text>
  <text x="614" y="148" fill="#00e676" font-family="monospace" font-size="22" font-weight="700">PASSED</text>
  <text x="716" y="148" fill="#8b9bb4" font-family="monospace" font-size="11">#a8f42c</text>

  <!-- Main Telemetry Graph Panel -->
  <rect x="28" y="184" width="744" height="240" rx="10" fill="#151d2c" stroke="rgba(255,255,255,0.08)"/>
  <text x="50" y="214" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">RENDER PASS GPU TIMESTAMPS &amp; FENCE SYNC (ms)</text>
  <text x="750" y="214" fill="#00d4ff" font-family="monospace" font-size="11" text-anchor="end">16.67 ms BUDGET LINE</text>

  <!-- 16.6ms Budget Dashed Line -->
  <line x1="50" y1="248" x2="750" y2="248" stroke="#ff5252" stroke-width="1" stroke-dasharray="6,4" opacity="0.7"/>

  <!-- Graph Area Fill (GPU Time) -->
  <path d="M50,340 L100,332 L150,336 L200,320 L250,328 L300,315 L350,325 L400,295 L450,322 L500,330 L550,318 L600,326 L650,312 L700,324 L750,318 L750,395 L50,395 Z" fill="url(#cyanGlow)"/>

  <!-- Graph Line (GPU Time) -->
  <polyline fill="none" stroke="#00d4ff" stroke-width="2.5" points="50,340 100,332 150,336 200,320 250,328 300,315 350,325 400,295 450,322 500,330 550,318 600,326 650,312 700,324 750,318"/>

  <!-- Secondary Line (CPU-GPU Fence Wait) -->
  <path d="M50,372 L100,370 L150,375 L200,368 L250,371 L300,365 L350,372 L400,358 L450,370 L500,374 L550,369 L600,372 L650,366 L700,371 L750,368 L750,395 L50,395 Z" fill="url(#amberGlow)"/>
  <polyline fill="none" stroke="#ff6b4a" stroke-width="2" points="50,372 100,370 150,375 200,368 250,371 300,365 350,372 400,358 450,370 500,374 550,369 600,372 650,366 700,371 750,368"/>

  <!-- Highlight Point -->
  <circle cx="400" cy="295" r="5" fill="#00d4ff" stroke="#0b0f17" stroke-width="2"/>
  <rect x="345" y="258" width="110" height="26" rx="5" fill="#0b0f17" stroke="#00d4ff" stroke-width="1"/>
  <text x="400" y="275" fill="#00d4ff" font-family="monospace" font-size="11" text-anchor="middle">ShadowPass: 5.4ms</text>

  <!-- Legend -->
  <circle cx="62" cy="408" r="4" fill="#00d4ff"/>
  <text x="72" y="412" fill="#8b9bb4" font-family="sans-serif" font-size="11">GPU Render Pass Time</text>
  <circle cx="212" cy="408" r="4" fill="#ff6b4a"/>
  <text x="222" y="412" fill="#8b9bb4" font-family="sans-serif" font-size="11">Fence Sync Wait</text>
  <text x="750" y="412" fill="#8b9bb4" font-family="monospace" font-size="11" text-anchor="end">Vulkan • C++ • Go • gRPC • TimescaleDB • React</text>
</svg>
